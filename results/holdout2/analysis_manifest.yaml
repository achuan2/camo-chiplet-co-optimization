  unique_feasible_designs_total: Canonical feasible hardware-mapping-realized-schedule
    fingerprints seen across all actual evaluations.
  final_population_feasible_count: Feasible members retained in the final fixed-size
    population.
  final_archive_feasible_count: Feasible members in the algorithm-reported rank-0
    archive.
  final_common_nd_feasible_objective_count: Unique feasible objective vectors from
    the final population that are nondominated under the common five-objective rule.
  primary_quality_set: The final common five-objective nondominated feasible points;
